<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: estante escura — uma coluna no celular, duas no PC; a sobra do mês em serifa abre a página.
   Paleta: Existential Angst (fundo), Dryad Bark (linhas), Light Charcoal (texto apagado),
   Ashes (texto e botões), Black Kite (vinho, gastos e alertas) e um dourado envelhecido para as pessoas. */
:root {
  --bg: #0a0a0a;            /* Existential Angst */
  --surface: #131211;
  --surface-2: #1c1a19;
  --line: #33312f;          /* Dryad Bark */
  --fg: #e6e2dc;
  --ashes: #b7b4ae;         /* Ashes */
  --muted: #8a857e;         /* entre Ashes e Light Charcoal */
  --faint: #726e68;         /* Light Charcoal */
  --accent: #b7b4ae;
  --accent-ink: #0a0a0a;
  --kite: #371e1e;          /* Black Kite */
  --out: #cf8a80;           /* vinho clareado para leitura */
  --in: #a9b896;            /* sálvia apagada */
  --in-soft: #1c2118;
  --warn: #e2a79c;
  --warn-soft: #371e1e;
  --her: #d6b25e;           /* dourado envelhecido */
  --her-ink: #171206;
  --her-soft: #241d0e;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.45);
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 50% at 50% -12%, #1f1313 0%, rgba(10,10,10,0) 60%) no-repeat, var(--bg);
  background-attachment: fixed; color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wrap { max-width: 1080px; margin: 0 auto; }

/* topo */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
}
.brand { font: 600 22px/1 var(--display); letter-spacing: .01em; color: var(--ashes); }
.brand small { display: block; font: 500 12px var(--body); color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.month { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month button { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.month button:hover { background: var(--surface-2); color: var(--fg); }
.month span { min-width: 112px; text-align: center; font-weight: 600; }
.top { flex-wrap: wrap; }
.logout { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.logout:hover { color: var(--fg); border-color: var(--ashes); }
details.more { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
details.more[open] summary { margin-bottom: 12px; }
.more-body { display: grid; gap: 12px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.confirm { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.bill-closed { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; }

.demo { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }

/* hero */
.hero { padding: 8px 0 22px; display: grid; gap: 14px; }
.hero .label { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.hero .big { font: 600 clamp(48px, 12vw, 84px)/1 var(--display); letter-spacing: -.01em; color: var(--fg); }
.hero .big.neg { color: var(--out); }
.hero .big .cents { font-size: .42em; vertical-align: 1em; margin-left: 2px; color: var(--muted); }
.hero .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .num { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.stat.in .num { color: var(--in); } .stat.out .num { color: var(--out); }

/* grade */
.grid { display: grid; gap: 16px; }
@media (min-width: 860px) { .grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } .col { display: grid; gap: 16px; } }
.col { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font: 600 19px/1.2 var(--display); margin: 0; color: var(--fg); }
.card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.card .head small { color: var(--muted); font-size: 13px; }
.link { border: 0; background: none; color: var(--ashes); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); font-weight: 700; padding: 0; font-size: 13px; }

/* revisar */
.review { border-color: #4a2a2a; background: linear-gradient(170deg, #1a1212, var(--surface) 60%); }
.review .count { background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 2px 9px; font-weight: 700; font-size: 13px; }
.qitem { display: grid; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.qitem:first-of-type { border-top: 0; padding-top: 0; }
.qrow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.qrow .what { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.qrow .meta { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip:hover { border-color: var(--ashes); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.her { border-color: color-mix(in srgb, var(--her) 35%, var(--line)); color: var(--her); }
.chip.her.on { background: var(--her); border-color: var(--her); color: var(--her-ink); }
.chip.ghost { border-style: dashed; }
.chip.ghost { background: none; }

/* faturas */
.bills { display: grid; gap: 12px; }
.bill { display: grid; gap: 8px; }
.bill .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bill .name { font-weight: 700; }
.bill .name small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ashes); border-radius: 99px; }
.bar i.hot { background: var(--out); }
.bill .dates { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); border: 1px solid #4a2a2a; }
.pill.ok { background: var(--in-soft); color: var(--accent); }

/* luiza */
.her-card { background: linear-gradient(160deg, var(--her-soft), var(--surface) 75%); border-color: color-mix(in srgb, var(--her) 40%, var(--line)); }
.her-card h2 { color: var(--her); }
.her-card .owed { font: 600 40px/1 var(--display); color: var(--her); letter-spacing: -.02em; margin: 4px 0 10px; }
.her-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.her { background: var(--her); border-color: var(--her); color: var(--her-ink); }
.btn:disabled { opacity: .5; cursor: default; }

/* categorias */
.cats { display: grid; gap: 10px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.cat .bar { grid-column: 1 / -1; height: 6px; }
.cat .pct { color: var(--muted); font-size: 12px; margin-left: 6px; }

/* evolução */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 600 11px var(--body); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* fixos */
.fixed { display: grid; gap: 2px; }
.fx { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.fx:first-child { border-top: 0; }
.fx .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 12px; color: var(--surface); }
.fx.paid .dot { background: var(--in); border-color: var(--in); color: var(--accent-ink); }
.fx.late .dot { border-color: var(--warn); }
.fx .n { flex: 1; min-width: 0; }
.fx .n small { display: block; color: var(--muted); font-size: 12px; }

/* lista */
.search { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); margin-bottom: 8px; }
.tx { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.tx:first-child { border-top: 0; }
.tx:hover .t1 { color: var(--ashes); }
.ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 14px var(--display); color: var(--muted); }
.ico.in { background: var(--in-soft); color: var(--in); }
.ico.her { background: var(--her-soft); color: var(--her); border-color: color-mix(in srgb, var(--her) 30%, var(--line)); }
.ico.out { background: var(--kite); color: var(--out); border-color: #4a2a2a; }
.t1 { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { text-align: right; }
.amt .num { font-size: 15px; }
.amt.out .num { color: var(--fg); } .amt.in .num { color: var(--in); } .amt.tr .num { color: var(--muted); }
.amt small { display: block; font-size: 11px; color: var(--her); font-weight: 700; }
.day { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 14px 0 2px; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }

/* botão + */
.fab {
  position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--ashes); color: var(--accent-ink);
  font: 400 32px/1 var(--body); box-shadow: 0 12px 30px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); z-index: 8;
}

/* folha (modal) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); border: 1px solid var(--line); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px; animation: up .22s ease-out;
}
@media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h3 { margin: 0; font: 600 22px/1.2 var(--display); }
.sheet .amount { font: 600 34px/1 var(--display); }
.sheet .orig { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.sheet .foot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.sheet .foot .right { display: flex; gap: 8px; margin-left: auto; }
.danger { color: var(--out); border-color: transparent; background: none; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ashes); color: var(--accent-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.lock { max-width: 400px; margin: 10vh auto 0; display: grid; gap: 14px; }
.lock h2 { font-size: 24px; }
.lock-sub { margin: 0; color: var(--muted); font-size: 14px; }
.lock-err { margin: 0; color: var(--out); font-weight: 600; font-size: 14px; }
/* Fase 3 */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; }
.tab:hover { color: var(--fg); }
.tab.on { background: var(--ashes); border-color: var(--ashes); color: var(--accent-ink); }
.screen { display: grid; gap: 16px; }
.stats4 { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }
@media (max-width: 640px) { .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat small { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.warn-txt { color: var(--warn) !important; cursor: pointer; text-decoration: underline; }
.neg-txt { color: var(--out) !important; } .in-txt { color: var(--in) !important; } .her-txt, .her-txt .num { color: var(--her); }
.alerts { border-color: #4a2a2a; }
.alert-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alert-list li { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--her); font-size: 14px; }
.alert-list li.alto { border-left-color: var(--out); background: #1d1313; }
.alert-list li[role="button"] { cursor: pointer; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kv > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.kv span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.kv b { font-size: 16px; font-weight: 500; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; margin: 12px 0; }
.field.inline { flex: 1; min-width: 180px; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
.filters { margin-bottom: 10px; }
.mini-sum { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 6px 0 4px; }
.mini-sum b { color: var(--fg); font-weight: 500; }
.months { display: flex; gap: 6px; align-items: flex-end; height: 160px; overflow-x: auto; padding-bottom: 4px; }
.mcol { flex: 1 0 34px; display: grid; gap: 4px; justify-items: center; height: 100%; grid-template-rows: 1fr auto; }
.mbars { display: flex; gap: 3px; align-items: flex-end; height: 100%; }
.mbars i { display: block; width: 10px; border-radius: 3px 3px 0 0; min-height: 1px; }
.b-in { background: var(--in); } .b-out { background: var(--out); }
.mcol small { font-size: 11px; color: var(--muted); }
.goal { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
.goal:first-of-type { border-top: 0; }
.goal .row { display: flex; justify-content: space-between; gap: 10px; }
.goal small { color: var(--muted); }
.goal .bar i { background: var(--her); }
.big-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.big-line b { font: 600 28px/1 var(--display); }
.sub-h { font: 600 15px var(--display); margin: 16px 0 6px; }
.fx[role="button"], .cat[role="button"] { cursor: pointer; }
.fx[role="button"]:hover b, .cat[role="button"]:hover b { color: var(--ashes); }
.ico.card { background: var(--kite); color: var(--out); } .ico.tr { color: var(--ashes); }
.ev-pago .dot, .ev-recebido .dot { background: var(--in); border-color: var(--in); color: var(--accent-ink); }
.ev-atrasado .dot { border-color: var(--out); } .ev-atrasado small { color: var(--out); }
.day.today { color: var(--her); }
.cat > span { min-width: 0; overflow-wrap: anywhere; }
.cat small { color: var(--muted); font-size: 11px; }
@media (max-width: 640px) { .cat { grid-template-columns: 1fr; } .cat > .num { font-size: 13px; } }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Finanças<small id="today"></small></div>
    <div class="month">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <span id="monthLabel"></span>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <button class="logout" id="logout" hidden>Sair</button>
  </header>
  <div id="demo" class="demo" hidden>Modo demonstração: os valores abaixo são exemplos. Instalado no Google, aparecem os seus dados reais.</div>
  <main id="app"><div class="loading">Carregando seus lançamentos…</div></main>
</div>
<button class="fab" id="fab" aria-label="Novo lançamento">+</button>
<div id="sheetRoot"></div>

<script>
// ───────── ponte com o Google (ou dados de exemplo fora dele) ─────────
// Três modos: dentro do Apps Script (google.script.run), hospedado fora do Google (API_URL)
// ou pré-visualização local com dados de exemplo.
const API_URL = 'https://script.google.com/macros/s/AKfycbz3Co8V8b3EVwtCHa3aMYF1LjFB_R9FrATPG4CdWmatZOLWApeCw8XNLnzIMLt_FVvl/exec';
const IN_GAS = typeof google !== 'undefined' && !!google.script;
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const IS_LOCAL = !IS_APP && /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) && !/[?&]api\b/.test(location.search);
// Parte nativa do app Android (leitura de notificações e botões "De quem foi?")
const Nativo = IS_APP && window.Capacitor.Plugins ? window.Capacitor.Plugins.Financas : null;
function nativo(metodo, dados) {
  if (!Nativo || !Nativo[metodo]) return Promise.resolve(null);
  return Nativo[metodo](dados || {}).catch(() => null);
}
const USE_API = !IN_GAS && !IS_LOCAL;
const NO_GOOGLE = !IN_GAS && !USE_API;
const SESS_KEY = 'fin_sessao';
const OPEN_API = ['api_estado', 'api_criarSenha', 'api_entrar'];
let SESSAO = (() => { try { return localStorage.getItem(SESS_KEY) || ''; } catch (e) { return ''; } })();
function saveSession(s) {
  SESSAO = s || '';
  try { s ? localStorage.setItem(SESS_KEY, s) : localStorage.removeItem(SESS_KEY); } catch (e) { /* fica só nesta aba */ }
  nativo('configurar', { sessao: SESSAO, url: API_URL });
}
function call(fn, ...args) {
  if (NO_GOOGLE) return Promise.resolve(Mock[fn](...args));
  const full = OPEN_API.includes(fn) ? args : [SESSAO, ...args];
  const onFail = err => { if (String((err && err.message) || err).includes('SESSAO')) { saveSession(''); closeSheet(); showLock(true); } };
  if (USE_API) {
    // text/plain evita a pré-verificação CORS, que o Apps Script não responde
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao: fn.replace(/^api_/, ''), args: full }) })
      .then(r => r.json())
      .then(res => { if (res.ok) return res.r; const e = new Error(res.erro); onFail(e); throw e; },
            err => { throw new Error('Sem conexão com a planilha. Verifique a internet e tente de novo.'); });
  }
  return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(err => { onFail(err); fail(err); })[fn](...full));
}

// ───────── utilidades ─────────
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = v => BRL.format(Number(v) || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const addMonths = (key, n) => { const [y, m] = key.split('-').map(Number); return ym(new Date(y, m - 1 + n, 1)); };
const monthName = (key, opts = { month: 'long', year: 'numeric' }) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', opts); };
const dShort = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

let DB = null;
let month = ym(new Date());

function load(json) {
  DB = typeof json === 'string' ? JSON.parse(json) : json;
  DB.lancamentos.forEach(t => {
    t._d = new Date(t['Data']); t['Valor'] = Number(t['Valor']) || 0; t['Parte terceiro'] = Number(t['Parte terceiro']) || 0;
    // fatura que a planilha transformou em data volta a ser "aaaa-mm"
    if (/^\d{4}-\d{2}-\d{2}T/.test(String(t['Fatura']))) t['Fatura'] = ym(new Date(t['Fatura']));
  });
  DB.lancamentos.sort((a, b) => b._d - a._d);
  render();
  if (IS_APP) {
    // ao abrir o app, recupera o que o celular não conseguiu enviar (sem internet, app congelado)
    if (!load.recuperou) { load.recuperou = true; nativo('reenviar').then(r => { if (r && r.entregues) toast(r.entregues + ' notificação(ões) atrasada(s) enviada(s).'); }); }
    nativo('configurar', { pessoa: people()[0] || '', url: API_URL, sessao: SESSAO }).then(st => {
      if (st && (!st.token || !st.leitura) && !load.avisou) { load.avisou = true; toast('Termine de configurar o app na aba Contas.'); }
    });
  }
}

// ───────── cálculos (sempre em centavos; as funções puras são testadas em testes.js) ─────────
function cents(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = typeof v === 'number' ? v : Number(String(v).replace(',', '.'));
  return isNaN(n) ? 0 : Math.round(n * 100);
}
const moneyC = c => BRL.format((c || 0) / 100);

/** Mesma regra do Code.gs: mês de vencimento ('aaaa-mm') da fatura de uma compra. */
function calcularFatura(fechamento, vencimento, data) {
  let ano = data.getFullYear(), mes = data.getMonth();
  if (data.getDate() >= fechamento) mes += 1;
  if (vencimento <= fechamento) mes += 1;
  ano += Math.floor(mes / 12);
  mes = mes % 12;
  return ano + '-' + String(mes + 1).padStart(2, '0');
}

/** Minha parte de um gasto. Pendente, previsto, transferência e pagamento de fatura nunca contam. */
function contaComoMeuGasto(t) {
  if (t['Tipo'] !== 'Saída' || t['Status'] === 'A classificar' || t['Status'] === 'Previsto') return 0;
  return Math.max(0, cents(t['Valor']) - cents(t['Parte terceiro']));
}

/** Renda: entrada confirmada que não é reembolso (pessoa marcada "não conta como renda"). */
function contaComoRenda(t, pessoas) {
  if (t['Tipo'] !== 'Entrada' || t['Status'] === 'A classificar' || t['Status'] === 'Previsto') return 0;
  const p = (pessoas || []).find(x => x['Nome'] === t['Pessoa']);
  if (p && /^n[aã]o$/i.test(String(p['Conta como renda']).trim())) return 0;
  return cents(t['Valor']);
}

/** Resumo de uma lista já filtrada pelo período, em centavos. */
function resumoMes(lista, pessoas) {
  const r = { entradas: 0, gastos: 0, previsto: 0, pendentes: 0, terceiros: 0 };
  lista.forEach(t => {
    r.entradas += contaComoRenda(t, pessoas);
    r.gastos += contaComoMeuGasto(t);
    if (t['Status'] === 'Previsto') r.previsto += cents(t['Valor']);
    if (t['Status'] === 'A classificar') r.pendentes += cents(t['Valor']);
    if (t['Tipo'] === 'Saída' && t['Status'] !== 'A classificar') r.terceiros += cents(t['Parte terceiro']);
  });
  return r;
}

/** Positivo: a pessoa me deve. Negativo: eu devo a ela. Em centavos. */
function saldoPessoa(lista, nome) {
  let s = 0;
  lista.forEach(t => {
    if (t['Pessoa'] !== nome || t['Status'] === 'A classificar') return;
    if (t['Tipo'] === 'Saída') s += cents(t['Parte terceiro']);
    else if (t['Tipo'] === 'Entrada') s -= cents(t['Valor']);
  });
  return s;
}

const CAT_ENTRE_CONTAS = 'Entre contas';
const CAT_FATURA = 'Pagamento de fatura';
const people = () => DB.pessoas.filter(p => norm(p['Controla saldo']) === 'SIM').map(p => p['Nome']);
const isPending = t => t['Status'] === 'Novo' || t['Status'] === 'A classificar';
const isCardPayment = t => t['Tipo'] === 'Transferência' && t['Categoria'] === CAT_FATURA;
function monthTx(key) { return DB.lancamentos.filter(t => ym(t._d) === key); }
/** Um cartão pode ter vários finais separados por "|" (virtual e físico na mesma fatura). */
const finaisDe = c => String(c['Final'] || '').split(/[|,/]/).map(norm).filter(Boolean);
function cardOf(id) { const a = norm(id); return a ? DB.cartoes.find(c => norm(c['Final']) === a || norm(c['Nome']) === a || finaisDe(c).includes(a)) : null; }
const finalLabel = f => { const l = String(f || '').split(/[|,/]/).map(s => s.trim()).filter(s => /^\d+$/.test(s)); return l.length ? 'final ' + l.join(' / ') : ''; };
const cardLabel = id => { const c = cardOf(id); return c ? c['Nome'] : String(id || ''); };

function summary(key) {
  const r = resumoMes(monthTx(key), DB.pessoas);
  const fixosPendentes = fixedStatus(key).filter(f => !f.paid).reduce((s, f) => s + cents(f.valor), 0);
  return Object.assign(r, { saldo: r.entradas - r.gastos, fixosPendentes,
    fimPrevisto: r.entradas + r.previsto - r.gastos - fixosPendentes });
}

/** Faturas de cada cartão: atual, fechada a pagar, próxima, limite usado. Tudo em centavos. */
function bills() {
  const today = new Date();
  return DB.cartoes.map(c => {
    const fech = Number(c['Fechamento']), venc = Number(c['Vencimento']);
    const open = calcularFatura(fech, venc, today);
    const mine = t => cardOf(t['Cartão']) === c;
    const compras = DB.lancamentos.filter(t => t['Tipo'] === 'Saída' && t['Forma'] === 'Crédito' && mine(t));
    const pagos = DB.lancamentos.filter(t => isCardPayment(t) && mine(t));
    const total = k => compras.filter(t => t['Fatura'] === k).reduce((s, t) => s + cents(t['Valor']), 0);
    const pago = k => pagos.filter(t => t['Fatura'] === k).reduce((s, t) => s + cents(t['Valor']), 0);
    const chaves = [...new Set(compras.map(t => t['Fatura']).concat(pagos.map(t => t['Fatura'])))].filter(Boolean);
    const devido = chaves.reduce((s, k) => s + Math.max(0, total(k) - pago(k)), 0);
    const datas = k => {
      const [y, m] = k.split('-').map(Number);
      return { fecha: new Date(y, m - 1 - (venc <= fech ? 1 : 0), fech), vence: new Date(y, m - 1, venc) };
    };
    const fechada = chaves.filter(k => k < open && total(k) - pago(k) > 0).sort().pop() || null;
    const d = datas(open);
    return { nome: c['Nome'], final: c['Final'], limite: cents(c['Limite']), open, atual: total(open), atualPaga: pago(open),
      proxima: total(addMonths(open, 1)), closes: d.fecha, due: d.vence, used: devido,
      daysToClose: Math.ceil((d.fecha - today) / 864e5),
      fechada: fechada && { chave: fechada, restante: total(fechada) - pago(fechada), vence: datas(fechada).vence },
      delas: compras.filter(t => t['Fatura'] === open).reduce((s, t) => s + cents(t['Parte terceiro']), 0) };
  });
}

/** Faturas que fazem sentido escolher num pagamento: as com saldo e a atual. */
function invoiceOptions(cardId) {
  const c = cardOf(cardId);
  if (!c) return [];
  const atual = calcularFatura(Number(c['Fechamento']), Number(c['Vencimento']), new Date());
  const ks = new Set([addMonths(atual, -1), atual]);
  DB.lancamentos.forEach(t => { if (cardOf(t['Cartão']) === c && t['Fatura']) ks.add(t['Fatura']); });
  return [...ks].sort().reverse();
}

function balanceOf(name) {
  const items = DB.lancamentos.filter(t => t['Pessoa'] === name && t['Status'] !== 'A classificar' &&
    ((t['Tipo'] === 'Saída' && cents(t['Parte terceiro']) > 0) || t['Tipo'] === 'Entrada'));
  return { saldo: saldoPessoa(DB.lancamentos, name), items };
}

function byCategory(key) {
  const map = {};
  monthTx(key).forEach(t => {
    const v = contaComoMeuGasto(t);
    if (!v) return;
    const c = t['Categoria'] || 'Sem categoria';
    map[c] = (map[c] || 0) + v;
  });
  const limits = Object.fromEntries(DB.categorias.map(c => [c['Categoria'], cents(c['Limite mensal'])]));
  return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([c, v]) => ({ c, v, lim: limits[c] || 0 }));
}

// ───────── renderização ─────────
function render() {
  const ml = monthName(month).replace(' de ', ' ');
  document.getElementById('monthLabel').textContent = ml.charAt(0).toUpperCase() + ml.slice(1);
  document.getElementById('today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelector('.month').hidden = !['resumo', 'lancamentos', 'planejamento'].includes(aba);
  const telas = { resumo: renderResumo, lancamentos: renderLancamentos, cartoes: renderCartoes, contas: renderContas,
    planejamento: renderPlanejamento, relatorios: renderRelatorios, calendario: renderCalendario };
  document.getElementById('app').innerHTML = navHTML() + `<div class="screen">${telas[aba]()}</div>`;
  bindApp();
  if (IS_APP && aba === 'contas') preencherAppCard();
}

function renderResumo() {
  const s = summary(month);
  const pend = DB.lancamentos.filter(isPending);
  const [inteiro, cts] = moneyC(s.saldo).split(',');
  const ultimos = monthTx(month).slice(0, 6);
  return `
    <section class="hero">
      <div class="label">Sobra de ${esc(monthName(month, { month: 'long' }))}</div>
      <div class="big num-like ${s.saldo < 0 ? 'neg' : ''}">${esc(inteiro)}<span class="cents">,${esc(cts)}</span></div>
      <div class="sub">${previewLine(s)}</div>
      <div class="stats">
        <div class="stat in"><b>Entrou</b><span class="num">${moneyC(s.entradas)}</span></div>
        <div class="stat out"><b>Gastei</b><span class="num">${moneyC(s.gastos)}</span></div>
        <div class="stat"><b>Previsto no fim</b><span class="num">${moneyC(s.fimPrevisto)}</span></div>
      </div>
      ${patrimonioHTML()}
    </section>
    <div class="grid">
      <div class="col">
        ${alertsCard()}
        ${pend.length ? reviewCard(pend) : ''}
        <section class="card"><div class="head"><h2>Últimos lançamentos</h2><button class="link" data-tab="lancamentos">Ver todos e filtrar</button></div>
          ${txRows(ultimos) || '<div class="empty">Nada neste mês ainda. Toque em + para lançar algo à mão.</div>'}</section>
      </div>
      <div class="col">
        ${billsCard()}
        ${people().map(herCard).join('')}
        ${catsCard()}
        ${fixedCard()}
        ${evolutionCard()}
      </div>
    </div>`;
}

function goTab(k) {
  aba = k;
  try { history.replaceState(null, '', '#' + k); } catch (e) { /* sem histórico, sem problema */ }
  render();
  window.scrollTo({ top: 0 });
}

function bindApp() {
  const app = document.getElementById('app');
  app.onclick = e => {
    const el = e.target.closest('[data-quick],[data-edit],[data-act],[data-her],[data-copy],[data-payfix],[data-tab],[data-payinv],[data-acc],[data-newacc],[data-transfer],[data-goal],[data-newgoal],[data-rec],[data-newrec],[data-budget],[data-period],[data-csv]');
    if (!el) return;
    const d = el.dataset;
    if (d.tab) return goTab(d.tab);
    if (d.quick) return quick(d.quick, d.kind, d.p);
    if (d.edit) return openEdit(d.edit, { nova: !!d.nova, modo: d.modo });
    if (d.act === 'allmine') return save(call('api_marcarTodosMeus'), 'Gastos marcados como seus');
    if (d.act === 'limpar') { Object.keys(filtros).forEach(k => { filtros[k] = ''; }); return render(); }
    if (d.her) return openHer(d.her);
    if (d.copy) return copySummary(d.copy);
    if (d.payfix) return openPayFixed(d.payfix);
    if (d.payinv) return openPayInvoice(d.payinv, d.fat);
    if (d.acc) return openAccount(d.acc);
    if (d.newacc) return openAccount('');
    if (d.transfer) return openTransfer();
    if (d.goal) return openGoal(d.goal);
    if (d.newgoal) return openGoal('');
    if (d.rec) return openRecurrence(d.rec);
    if (d.newrec) return openRecurrence('');
    if (d.budget) return openBudget(d.budget);
    if (d.period) { periodo.tipo = d.period; return render(); }
    if (d.csv) return baixarCSV();
  };
  app.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const d = e.target.dataset || {};
    if (d.edit) openEdit(d.edit);
    else if (d.tab || d.acc || d.goal || d.rec || d.budget) e.target.click();
  };
  app.onchange = e => {
    const d = e.target.dataset || {};
    if (d.filtro && d.filtro !== 'texto') { filtros[d.filtro] = e.target.value; render(); }
    if (d.fatsel) { DB._faturaSel = Object.assign(DB._faturaSel || {}, { [d.fatsel]: e.target.value }); render(); }
    if (d.pdate) { periodo[d.pdate] = e.target.value; render(); }
  };
  const busca = app.querySelector('[data-filtro="texto"]');
  if (busca) busca.oninput = () => {
    filtros.texto = busca.value;
    const pos = busca.selectionStart;
    render();
    const n = document.querySelector('[data-filtro="texto"]');
    n.focus(); n.setSelectionRange(pos, pos);
  };
}

function previewLine(s) {
  const parts = [];
  if (s.previsto) parts.push(`salário de ${moneyC(s.previsto)} ainda vai cair`);
  if (s.fixosPendentes) parts.push(`${moneyC(s.fixosPendentes)} em contas fixas a pagar`);
  const base = parts.length ? 'O previsto considera que ' + parts.join(' e ') + '.' : 'Entradas menos a sua parte dos gastos.';
  return base + (s.pendentes ? ` <b>${moneyC(s.pendentes)}</b> aguardam revisão e ainda não entram na conta.` : '');
}

function reviewCard(pend) {
  const show = pend.slice(0, 5);
  return `<section class="card review" id="revisar">
    <div class="head"><h2>A revisar</h2><span class="count">${pend.length}</span></div>
    ${show.map(t => `
      <div class="qitem">
        <div class="qrow">
          <div><div class="what">${esc(t['Descrição'] || t['Estabelecimento'])}</div>
          <div class="meta">${t['Status'] === 'A classificar' ? '<span class="pill">não conta até revisar</span> ' : ''}${esc(t['Conta'])} · ${esc(t['Forma'])}${t['Cartão'] ? ' ' + esc(cardLabel(t['Cartão'])) : ''} · ${dShort(t._d)} ${t._d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div></div>
          <div class="num" style="color:${t['Tipo'] === 'Entrada' ? 'var(--in)' : 'var(--fg)'}">${t['Tipo'] === 'Entrada' ? '+' : ''}${money(t['Valor'])}</div>
        </div>
        <div class="chips">${quickChips(t)}</div>
      </div>`).join('')}
    <div class="foot" style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap">
      ${pend.length > 5 ? `<small style="color:var(--muted)">+${pend.length - 5} na fila</small>` : '<span></span>'}
      ${pend.some(t => t['Tipo'] === 'Saída') ? '<button class="link" data-act="allmine">Marcar gastos restantes como meus</button>' : ''}
    </div>
  </section>`;
}

function quickChips(t) {
  const id = esc(t['ID']);
  if (t['Status'] === 'Previsto') return `<button class="chip" data-edit="${id}">Confirmar salário</button>`;
  if (t['Tipo'] === 'Entrada') {
    return `<button class="chip" data-quick="${id}" data-kind="salario">Salário</button>` +
      DB.pessoas.map(p => `<button class="chip ${norm(p['Controla saldo']) === 'SIM' ? 'her' : ''}" data-quick="${id}" data-kind="pessoa" data-p="${esc(p['Nome'])}">${esc(p['Nome'])}</button>`).join('') +
      `<button class="chip ghost" data-edit="${id}" data-nova="1">Outra pessoa…</button>` +
      `<button class="chip" data-quick="${id}" data-kind="transf">Entre minhas contas</button>`;
  }
  const main = people()[0];
  return `<button class="chip" data-quick="${id}" data-kind="meu">Meu</button>` +
    (main ? `<button class="chip her" data-quick="${id}" data-kind="dela" data-p="${esc(main)}">${esc(main)}</button><button class="chip her" data-quick="${id}" data-kind="div" data-p="${esc(main)}">Dividir</button>` : '') +
    `<button class="chip ghost" data-edit="${id}" data-nova="1">Outra pessoa…</button>` +
    (t['Forma'] === 'Pix' ? `<button class="chip" data-quick="${id}" data-kind="transf">Entre minhas contas</button><button class="chip" data-edit="${id}" data-modo="fatura">Pagamento de fatura</button>` : '') +
    `<button class="chip ghost" data-edit="${id}">Detalhar…</button>`;
}

function billsCard() {
  const today = new Date();
  return `<section class="card"><div class="head"><h2>Faturas</h2><small>valor total do cartão</small></div>
    <div class="bills">${bills().map(b => {
      const pct = b.limite ? Math.min(100, b.used / b.limite * 100) : 0;
      const tag = b.atual && b.atualPaga >= b.atual ? '<span class="pill ok">paga</span>'
        : b.daysToClose <= 0 ? '<span class="pill">fechada</span>'
        : b.daysToClose <= 3 ? `<span class="pill">fecha em ${b.daysToClose} dia${b.daysToClose > 1 ? 's' : ''}</span>` : '<span class="pill ok">aberta</span>';
      const fechada = b.fechada ? `<div class="bill-closed"><span>Fatura fechada a pagar: <b class="num">${moneyC(b.fechada.restante)}</b></span>
        <span class="pill">${b.fechada.vence < today ? 'vencida em' : 'vence'} ${dShort(b.fechada.vence)}</span></div>` : '';
      return `<div class="bill">
        <div class="row"><span class="name">${esc(b.nome)}<small>${esc(finalLabel(b.final))}</small></span>${tag}</div>
        ${fechada}
        <div class="row"><span class="num" style="font-size:22px;font-weight:500">${moneyC(b.atual)}</span><span style="color:var(--muted);font-size:13px">próxima: <span class="num">${moneyC(b.proxima)}</span></span></div>
        <div class="bar" title="${pct.toFixed(0)}% do limite em uso"><i class="${pct > 70 ? 'hot' : ''}" style="width:${pct}%"></i></div>
        <div class="dates"><span>Fecha ${dShort(b.closes)}</span><span>Vence ${dShort(b.due)}</span><span>Limite livre <span class="num">${moneyC(b.limite - b.used)}</span></span>${b.delas ? `<span style="color:var(--her);font-weight:700">Não é seu: ${moneyC(b.delas)}</span>` : ''}</div>
      </div>`; }).join('')}</div></section>`;
}

function herCard(name) {
  const { saldo, items } = balanceOf(name);
  return `<section class="card her-card">
    <div class="head"><h2>${esc(name)}</h2><small>${items.length} lançamento${items.length === 1 ? '' : 's'}</small></div>
    <div style="font-size:13px;color:var(--muted)">${saldo >= 0 ? esc(name) + ' te deve' : 'Você deve a ' + esc(name)}</div>
    <div class="owed num-like">${moneyC(Math.abs(saldo))}</div>
    <div class="actions">
      <button class="btn her" data-her="${esc(name)}">Ver detalhes</button>
      <button class="btn" data-copy="${esc(name)}">Copiar resumo</button>
    </div></section>`;
}

function catsCard() {
  const cats = byCategory(month);
  const total = cats.reduce((s, c) => s + c.v, 0);
  const max = Math.max(...cats.map(c => Math.max(c.v, c.lim)), 1);
  return `<section class="card"><div class="head"><h2>Para onde foi</h2><small>só a sua parte, já revisada</small></div>
    ${cats.length ? `<div class="cats">${cats.map(c => `
      <div class="cat"><span><b>${esc(c.c)}</b><span class="pct">${total ? Math.round(c.v / total * 100) : 0}%</span></span>
      <span class="num">${moneyC(c.v)}${c.lim ? ` <span style="color:var(--muted);font-size:12px">/ ${moneyC(c.lim)}</span>` : ''}</span>
      <div class="bar"><i class="${c.lim && c.v > c.lim ? 'hot' : ''}" style="width:${c.v / max * 100}%"></i></div></div>`).join('')}</div>`
      : '<div class="empty">Nenhum gasto neste mês ainda.</div>'}
  </section>`;
}

function fixedCard() {
  const fx = fixedStatus(month);
  if (!fx.length) return '';
  return `<section class="card"><div class="head"><h2>Contas fixas</h2><small>${fx.filter(f => f.paid).length} de ${fx.length} pagas</small></div>
    <div class="fixed">${fx.map(f => `
      <div class="fx ${f.paid ? 'paid' : f.late ? 'late' : ''}">
        <span class="dot">${f.paid ? '✓' : ''}</span>
        <span class="n"><b>${esc(f.nome)}</b><small>dia ${f.dia} · ${esc(f.forma || '')}${f.late ? ' · <span style="color:var(--warn)">atrasada?</span>' : ''}</small></span>

      </div>`).join('')}</div></section>`;

function evolutionCard() {
  const keys = Array.from({ length: 6 }, (_, i) => addMonths(month, i - 5));
  const data = keys.map(k => { const s = summary(k); return { k, e: s.entradas, g: s.gastos }; });
  const max = Math.max(...data.map(d => Math.max(d.e, d.g)), 1);
  const W = 320, H = 150, pad = 22, bw = 14, step = (W - 20) / 6;
  const y = v => H - pad - (v / max) * (H - pad - 10);
  const bars = data.map((d, i) => {
    const x = 14 + i * step + step / 2;
    return `<rect x="${x - bw - 1}" y="${y(d.e)}" width="${bw}" height="${H - pad - y(d.e)}" rx="3" fill="var(--in)" opacity="${d.k === month ? 1 : .55}"></rect>
      <rect x="${x + 1}" y="${y(d.g)}" width="${bw}" height="${H - pad - y(d.g)}" rx="3" fill="var(--out)" opacity="${d.k === month ? 1 : .55}"></rect>
      <text x="${x}" y="${H - 6}" text-anchor="middle">${esc(monthName(d.k, { month: 'short' }).replace('.', ''))}</text>`;
  }).join('');
  return `<section class="card"><div class="head"><h2>Últimos 6 meses</h2></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e gastos dos últimos 6 meses">
      <line x1="10" x2="${W - 6}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"></line>${bars}</svg>
    <div class="legend"><span><i style="background:var(--in)"></i>Entradas</span><span><i style="background:var(--out)"></i>Minha parte dos gastos</span></div>
  </section>`;
}

/** Saldo de uma conta em centavos: saldo conferido + movimentos depois desse momento. null = sem saldo inicial. */
function saldoConta(conta, lista) {
  const ini = conta['Saldo inicial'];
  if (ini === '' || ini === null || ini === undefined || !conta['Data do saldo']) return null;
  const desde = new Date(conta['Data do saldo']).getTime();
  let s = cents(ini);
  lista.forEach(t => {
    if (t['Conta'] !== conta['Nome'] || t['Forma'] === 'Crédito' || t['Status'] === 'Previsto') return;
    const d = (t._d || new Date(t['Data'])).getTime();
    if (!(d > desde)) return;
    const sentido = t['Sentido'] || (t['Tipo'] === 'Entrada' ? 'Entrada' : t['Tipo'] === 'Saída' ? 'Saída' : '');
    if (sentido === 'Entrada') s += cents(t['Valor']);
    else if (sentido === 'Saída') s -= cents(t['Valor']);
  });
  return s;
}

/** Datas de uma recorrência entre `de` e `ate` (inclusive). Pausada ou cancelada não gera nada. */
function ocorrencias(rec, de, ate) {
  const ativo = String(rec['Ativo'] || 'Sim');
  if (ativo === 'Não' || ativo === 'Pausado') return [];
  const freq = rec['Frequência'] || 'Mensal';
  const ini = rec['Início'] ? new Date(rec['Início']) : null;
  const fim = rec['Fim'] ? new Date(rec['Fim']) : null;
  const dia0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const out = [];
  const push = d => {
    if (d < dia0(de) || d > ate) return;
    if (ini && d < dia0(ini)) return;
    if (fim && d > fim) return;
    out.push(d);
  };
  if (freq === 'Mensal') {
    const diaMes = Number(rec['Dia']) || 1;
    for (let y = de.getFullYear(), m = de.getMonth(); y < ate.getFullYear() || (y === ate.getFullYear() && m <= ate.getMonth());) {
      const ultimo = new Date(y, m + 1, 0).getDate();
      push(new Date(y, m, Math.min(diaMes, ultimo)));
      m++; if (m > 11) { m = 0; y++; }
    }
    return out;
  }
  if (!ini) return out;
  if (freq === 'Anual') {
    for (let y = de.getFullYear(); y <= ate.getFullYear(); y++) {
      const ultimo = new Date(y, ini.getMonth() + 1, 0).getDate();
      push(new Date(y, ini.getMonth(), Math.min(ini.getDate(), ultimo)));
    }
    return out;
  }
  const passo = freq === 'Semanal' ? 7 : Number(rec['Intervalo (dias)']) || 0;
  if (passo < 1) return out;
  let d = dia0(ini);
  for (let i = 0; i < 2000 && d <= ate; i++) { push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + passo); }
  return out;
}

/**
 * Para cada data prevista, diz se já foi paga: procura um lançamento revisado do mesmo tipo
 * com a palavra-chave (ou o nome), perto da data, sem usar o mesmo lançamento duas vezes.
 */
function situacaoOcorrencias(rec, datas, lista, hoje) {
  const norm2 = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const chaves = String(rec['Palavra-chave'] || rec['Nome'] || '').split('|').map(norm2).map(s => s.trim()).filter(s => s.length >= 3);
  const tipo = rec['Tipo'] === 'Entrada' ? 'Entrada' : 'Saída';
  const freq = rec['Frequência'] || 'Mensal';
  const usados = new Set();
  return datas.map(data => {
    const casa = t => {
      if (usados.has(t['ID']) || t['Tipo'] !== tipo || t['Status'] === 'A classificar' || t['Status'] === 'Previsto') return false;
      const d = t._d || new Date(t['Data']);
      const perto = freq === 'Mensal' ? d.getFullYear() === data.getFullYear() && d.getMonth() === data.getMonth()
        : Math.abs(d - data) <= (freq === 'Anual' ? 15 : 4) * 864e5;
      if (!perto) return false;
      const texto = norm2(t['Estabelecimento'] + ' ' + t['Descrição']);
      return chaves.some(k => texto.includes(k));
    };
    const lanc = lista.find(casa) || null;
    if (lanc) usados.add(lanc['ID']);
    return { data, pago: !!lanc, lanc, atrasada: !lanc && data < new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()) };
  });
}

/** Agrupa uma lista (período já filtrado) para os relatórios. Centavos. */
function relatorio(lista, pessoas, nomeCartao) {
  const r = Object.assign(resumoMes(lista, pessoas), { porCategoria: {}, porConta: {}, porCartao: {}, porMes: {} });
  const somar = (obj, k, v) => { if (v) obj[k] = (obj[k] || 0) + v; };
  lista.forEach(t => {
    const meu = contaComoMeuGasto(t);
    const d = t._d || new Date(t['Data']);
    const mes = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    somar(r.porCategoria, t['Categoria'] || 'Sem categoria', meu);
    somar(r.porConta, t['Forma'] === 'Crédito' ? 'Cartão ' + nomeCartao(t['Cartão']) : (t['Conta'] || 'Sem conta'), meu);
    if (t['Tipo'] === 'Saída' && t['Forma'] === 'Crédito' && t['Status'] !== 'A classificar') somar(r.porCartao, nomeCartao(t['Cartão']), cents(t['Valor']));
    r.porMes[mes] = r.porMes[mes] || { entradas: 0, gastos: 0 };
    r.porMes[mes].entradas += contaComoRenda(t, pessoas);
    r.porMes[mes].gastos += meu;
  });
  r.economia = r.entradas - r.gastos;
  return r;
}

/** CSV no formato do Excel brasileiro (separador ";", vírgula decimal, BOM para acentos). */
function gerarCSV(lista) {
  const cols = ['Data', 'Tipo', 'Valor', 'Descrição', 'Estabelecimento', 'Categoria', 'Conta', 'Forma', 'Cartão', 'Fatura',
    'Pessoa', 'Divisão', 'Parte terceiro', 'Status', 'Parcela'];
  const campo = (c, t) => {
    let v = t[c];
    if (c === 'Data') v = (t._d || new Date(t['Data'])).toLocaleString('pt-BR');
    if (c === 'Valor' || c === 'Parte terceiro') v = (cents(v) / 100).toFixed(2).replace('.', ',');
    v = String(v === null || v === undefined ? '' : v);
    return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  return '﻿' + [cols.join(';')].concat(lista.map(t => cols.map(c => campo(c, t)).join(';'))).join('\r\n');
}

/** Progresso de uma meta em centavos; se a meta está ligada a uma conta, usa o saldo dela. */
function progressoMeta(meta, saldoDaConta) {
  const alvo = cents(meta['Valor alvo']);
  const atual = saldoDaConta !== null && saldoDaConta !== undefined ? saldoDaConta : cents(meta['Valor atual']);
  return { alvo, atual, pct: alvo ? Math.max(0, Math.min(100, Math.round(atual / alvo * 100))) : 0, falta: Math.max(0, alvo - atual) };
}

}

/** Ocorrências previstas de todas as recorrências ativas no intervalo, com situação (paga/atrasada). */
function agenda(de, ate) {
  const hoje = new Date();
  const out = [];
  recorrencias().forEach(rec => {
    situacaoOcorrencias(rec, ocorrencias(rec, de, ate), DB.lancamentos, hoje).forEach(o => out.push(Object.assign(o, { rec })));
  });
  return out.sort((a, b) => a.data - b.data);
}

/** Substitui a versão da Fase 2: usa as recorrências (mensal, semanal, anual, personalizada). */
function fixedStatus(key) {
  return agenda(iniMes(key), fimMes(key)).filter(o => o.rec['Tipo'] !== 'Entrada').map(o => ({
    nome: o.rec['Nome'], valor: cents(o.rec['Valor']) / 100, dia: o.data.getDate(), forma: o.rec['Forma'],
    paid: o.pago, hit: o.lanc, late: o.atrasada, data: o.data,
  }));
}

function alertas() {
  const out = [];
  const hoje = new Date(), em3 = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 3, 23, 59);
  // só o mês atual: o que venceu antes de o sistema existir não tem como aparecer como pago
  agenda(new Date(hoje.getFullYear(), hoje.getMonth(), 1), em3).forEach(o => {
    if (o.pago || o.rec['Tipo'] === 'Entrada') return;
    if (o.atrasada) out.push({ nivel: 'alto', texto: `${o.rec['Nome']} venceu em ${dShort(o.data)} e não aparece como paga.` });
    else out.push({ nivel: 'medio', texto: `${o.rec['Nome']} vence ${o.data.toDateString() === hoje.toDateString() ? 'hoje' : 'em ' + dShort(o.data)} (${money(o.rec['Valor'])}).` });
  });
  const limCartao = Number(cfg('Alerta de limite do cartão (%)')) || 80;
  bills().forEach(b => {
    if (b.fechada) out.push({ nivel: b.fechada.vence < hoje ? 'alto' : 'medio',
      texto: `Fatura ${b.nome}: ${moneyC(b.fechada.restante)} ${b.fechada.vence < hoje ? 'venceu em' : 'vence em'} ${dShort(b.fechada.vence)}.` });
    if (b.limite && b.used / b.limite * 100 >= limCartao) out.push({ nivel: 'medio', texto: `${b.nome}: ${Math.round(b.used / b.limite * 100)}% do limite em uso.` });
  });
  const mesAtual = ym(hoje);
  byCategory(mesAtual).forEach(c => {
    if (!c.lim) return;
    const p = c.v / c.lim * 100;
    if (p >= 100) out.push({ nivel: 'alto', texto: `${c.c}: passou do limite (${moneyC(c.v)} de ${moneyC(c.lim)}).` });
    else if (p >= pctAlerta()) out.push({ nivel: 'medio', texto: `${c.c}: ${Math.round(p)}% do limite do mês.` });
  });
  const geral = cents(cfg('Limite mensal geral'));
  const gastoMes = summary(mesAtual).gastos;
  if (geral && gastoMes >= geral * pctAlerta() / 100) out.push({ nivel: gastoMes >= geral ? 'alto' : 'medio', texto: `Gastos do mês: ${moneyC(gastoMes)} de ${moneyC(geral)} do limite geral.` });
  const anteriores = [1, 2, 3].map(n => summary(addMonths(mesAtual, -n)).gastos).filter(v => v > 0);
  if (anteriores.length) {
    const media = anteriores.reduce((s, v) => s + v, 0) / anteriores.length;
    if (gastoMes > media * 1.3) out.push({ nivel: 'medio', texto: `Você já gastou ${Math.round((gastoMes / media - 1) * 100)}% a mais que a média dos últimos meses.` });
  }
  const pend = DB.lancamentos.filter(t => t['Status'] === 'A classificar').length;
  if (pend) out.push({ nivel: 'medio', texto: `${pend} movimento${pend > 1 ? 's' : ''} esperando revisão.`, tab: 'lancamentos' });
  return out.sort((a, b) => (a.nivel === 'alto' ? 0 : 1) - (b.nivel === 'alto' ? 0 : 1));
}

function filtrarLancamentos() {
  const f = filtros;
  const de = f.de ? new Date(f.de + 'T00:00:00') : iniMes(month);
  const ate = f.ate ? new Date(f.ate + 'T23:59:59') : fimMes(month);
  const q = norm(f.texto);
  return DB.lancamentos.filter(t => {
    if (t._d < de || t._d > ate) return false;
    if (q && !norm([t['Descrição'], t['Estabelecimento'], t['Categoria'], t['Pessoa'], t['Conta']].join(' ')).includes(q)) return false;
    if (f.tipo && t['Tipo'] !== f.tipo) return false;
    if (f.status && t['Status'] !== f.status) return false;
    if (f.conta && t['Conta'] !== f.conta) return false;
    if (f.cartao && cardOf(t['Cartão']) !== cardOf(f.cartao)) return false;
    if (f.pessoa && t['Pessoa'] !== f.pessoa) return false;
    if (f.categoria && t['Categoria'] !== f.categoria) return false;
    if (f.forma && t['Forma'] !== f.forma) return false;
    if (f.origem && t['Origem'] !== f.origem) return false;
    if (f.min !== '' && cents(t['Valor']) < cents(f.min)) return false;
    if (f.max !== '' && cents(t['Valor']) > cents(f.max)) return false;
    return true;
  });
}

    const pagos = DB.lancamentos.filter(t => isCardPayment(t) && cardOf(t['Cartão']) === c && t['Fatura'] === sel);
    const totalSel = daFatura.reduce((s, t) => s + cents(t['Valor']), 0);
    const pagoSel = pagos.reduce((s, t) => s + cents(t['Valor']), 0);
    const grupos = {};
    compras.filter(t => t['Grupo']).forEach(t => { (grupos[t['Grupo']] = grupos[t['Grupo']] || []).push(t); });
    const parcelas = Object.values(grupos).map(g => {

        <div><span>Disponível</span><b class="num">${moneyC(b.limite - b.used)}</b></div>
        <div><span>Próxima fatura</span><b class="num">${moneyC(b.proxima)}</b></div>
      </div>
      <div class="bar"><i class="${b.limite && b.used / b.limite > .7 ? 'hot' : ''}" style="width:${b.limite ? Math.min(100, b.used / b.limite * 100) : 0}%"></i></div>
      ${b.fechada ? `<div class="bill-closed"><span>Fatura fechada a pagar: <b class="num">${moneyC(b.fechada.restante)}</b> · vence ${dShort(b.fechada.vence)}</span></div>` : ''}

        <button class="btn primary" data-payinv="${esc(cardValue(c))}" data-fat="${esc(sel)}">Registrar pagamento</button></div>
      <div class="mini-sum"><span>Total <b class="num">${moneyC(totalSel)}</b></span><span>Pago <b class="num">${moneyC(pagoSel)}</b></span><span>Falta <b class="num">${moneyC(Math.max(0, totalSel - pagoSel))}</b></span></div>
      <div>${txRows(daFatura.concat(pagos)) || '<div class="empty">Nenhuma compra nesta fatura.</div>'}</div>
      ${parcelas.length ? `<h3 class="sub-h">Parcelamentos em andamento</h3><div class="fixed">${parcelas.map(p => `<div class="fx"><span class="n"><b>${esc(p.nome)}</b><small>faltam ${p.restantes} de ${p.total} parcelas</small></span><span class="num">${moneyC(p.valor)}</span></div>`).join('')}</div>` : ''}

}

/** Preenche o cartão "App no celular": token, permissão de leitura, teste. */
function preencherAppCard() {
  const el = document.getElementById('appCard');
  if (!el) return;
  nativo('estado').then(st => {
    if (!st) { el.querySelector('.empty').textContent = 'Parte nativa indisponível nesta versão.'; return; }
    const item = (ok, txt) => `<div class="fx ${ok ? 'paid' : 'late'}"><span class="dot">${ok ? '✓' : ''}</span><span class="n"><b>${txt}</b></span></div>`;
    el.innerHTML = `<div class="head"><h2>App no celular</h2><small>substitui o MacroDroid</small></div>
      <div class="fixed">${item(st.token, 'Token do receptor salvo')}${item(st.leitura, 'Leitura de notificações liberada')}${item(st.avisos, 'Notificação "De quem foi?" permitida')}${item(st.sessao, 'Sessão do painel guardada para os botões')}</div>
      <label class="field" style="margin-top:10px"><span>Token (aba Config da planilha)</span><input id="apToken" autocomplete="off" placeholder="${st.token ? 'já salvo — cole outro para trocar' : 'cole aqui'}"></label>
      <div class="row-actions"><button class="btn" id="apSalvar">Salvar token</button><button class="btn" id="apLeitura">Liberar leitura</button><button class="btn primary" id="apTestar">Testar conexão</button></div>
      <p class="hint">Depois que o teste der certo e uma compra real aparecer em "A revisar", desligue a macro do MacroDroid para não ficar com dois leitores.</p>
      <h3 class="sub-h">Últimos envios <button class="link" id="apReenviar">Reenviar agora</button></h3>
      <div id="apHist" class="fixed"><div class="empty">Carregando…</div></div>`;
    el.querySelector('#apReenviar').onclick = () => nativo('reenviar').then(r => {
      toast(!r ? 'Indisponível nesta versão do app.' : (r.entregues ? r.entregues + ' enviada(s). ' : 'Nada atrasado. ') + (r.leitorAtivo ? '' : 'O leitor está parado: confira a permissão.'));
      preencherAppCard();
    });
    nativo('historico').then(h => {
      const box = el.querySelector('#apHist');
      if (!h) { box.innerHTML = '<div class="empty">Atualize o app para ver o histórico.</div>'; return; }
      let itens = [];
      try { itens = JSON.parse(h.itens || '[]').reverse().slice(0, 10); } catch (e) { itens = []; }
      const rotulo = r => /ok:/.test(r) ? ['paid', 'registrado'] : /duplicado/.test(r) ? ['paid', 'já tinha'] : /não reconhecido|ignorado/.test(r) ? ['', 'sem valor de compra'] : ['late', r];
      box.innerHTML = (h.pendentes ? `<div class="bill-closed">${h.pendentes} aguardando internet para reenviar</div>` : '') +
        (h.leitorAtivo ? '' : '<div class="bill-closed">O leitor de notificações não está ativo agora.</div>') +
        (itens.map(i => { const [cls, txt] = rotulo(String(i.resultado || '')); return `<div class="fx ${cls}"><span class="dot">${cls === 'paid' ? '✓' : ''}</span><span class="n"><b>${esc(String(i.texto).slice(0, 70))}</b><small>${new Date(i.quando).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} · ${esc(txt)}</small></span></div>`; }).join('') || '<div class="empty">Nenhum envio ainda.</div>');
    });
    el.querySelector('#apSalvar').onclick = () => {
      const t = el.querySelector('#apToken').value.trim();
      if (!t) return toast('Cole o token da aba Config.');
      nativo('configurar', { token: t, url: API_URL }).then(() => { toast('Token salvo.'); preencherAppCard(); });
    };
    el.querySelector('#apLeitura').onclick = () => nativo('abrirPermissaoNotificacoes');
    el.querySelector('#apTestar').onclick = () => nativo('testar').then(r => {
      const resp = r && r.resposta || 'sem resposta';
      toast(resp === 'não reconhecido' ? 'Conexão ok: o receptor respondeu.' : resp === 'negado' ? 'Token errado: confira na aba Config.' : 'Resposta: ' + resp);
    });
  });
}

function periodoAtual() {
  const hoje = new Date();
  if (periodo.tipo === 'anterior') { const k = addMonths(ym(hoje), -1); return [iniMes(k), fimMes(k), monthName(k)]; }
  if (periodo.tipo === 'ano') return [new Date(hoje.getFullYear(), 0, 1), new Date(hoje.getFullYear(), 11, 31, 23, 59, 59), String(hoje.getFullYear())];
  if (periodo.tipo === 'custom' && periodo.de && periodo.ate) return [new Date(periodo.de + 'T00:00:00'), new Date(periodo.ate + 'T23:59:59'), 'período escolhido'];
  return [iniMes(ym(hoje)), fimMes(ym(hoje)), monthName(ym(hoje))];
}

function barras(obj, total) {
  const itens = Object.entries(obj).sort((a, b) => b[1] - a[1]);
  if (!itens.length) return '<div class="empty">Sem dados no período.</div>';
  const max = Math.max(...itens.map(i => i[1]), 1);
  return `<div class="cats">${itens.map(([k, v]) => `<div class="cat"><span><b>${esc(k)}</b>${total ? `<span class="pct">${Math.round(v / total * 100)}%</span>` : ''}</span><span class="num">${moneyC(v)}</span><div class="bar"><i style="width:${v / max * 100}%"></i></div></div>`).join('')}</div>`;
}

function renderCalendario() {
  const hoje = new Date();
  const de = new Date(hoje.getFullYear(), hoje.getMonth(), 1), ate = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 45, 23, 59);
  const ev = [];
  agenda(de, ate).forEach(o => ev.push({ data: o.data, nome: o.rec['Nome'], valor: cents(o.rec['Valor']), tipo: o.rec['Tipo'] === 'Entrada' ? 'Entrada recorrente' : 'Conta fixa',
    estado: o.pago ? 'pago' : o.atrasada ? 'atrasado' : 'previsto' }));
  (DB.salario || []).forEach(s => {
    const d = new Date(s.data); if (d < de || d > ate) return;
    const lanc = DB.lancamentos.find(t => t['Origem'] === 'Salário' && Math.abs(t._d - d) < 4 * 864e5);
    ev.push({ data: d, nome: 'Salário', valor: lanc ? cents(lanc['Valor']) : cents(s.valor), tipo: 'Salário',
      estado: lanc && lanc['Status'] === 'OK' ? 'recebido' : cents(s.valor) ? 'previsto' : 'sem valor definido' });
  });
  bills().forEach(b => {
    [[b.due, b.atual - b.atualPaga, b.open]].concat(b.fechada ? [[b.fechada.vence, b.fechada.restante, b.fechada.chave]] : []).forEach(([d, v, k]) => {
      if (d >= de && d <= ate) ev.push({ data: d, nome: 'Fatura ' + b.nome, valor: Math.max(0, v), tipo: 'Fatura', estado: v <= 0 ? 'pago' : d < hoje ? 'atrasado' : 'previsto' });
    });
  });
  (DB.metas || []).forEach(m => { if (m['Data alvo']) { const d = new Date(m['Data alvo']); if (d >= de && d <= ate) ev.push({ data: d, nome: 'Prazo da meta ' + m['Nome'], valor: cents(m['Valor alvo']), tipo: 'Meta', estado: 'prazo' }); } });
  ev.sort((a, b) => a.data - b.data);
  let last = '';
  return `<section class="card"><div class="head"><h2>Calendário</h2><small>deste mês até ${dShort(ate)}</small></div>
    ${ev.map(e => {
      const dia = e.data.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
      const h = dia !== last ? `<div class="day ${e.data.toDateString() === hoje.toDateString() ? 'today' : ''}">${esc(dia)}</div>` : ''; last = dia;
      return `${h}<div class="fx ev-${e.estado.replace(/\s.*/, '')}"><span class="dot">${e.estado === 'pago' || e.estado === 'recebido' ? '✓' : ''}</span>
        <span class="n"><b>${esc(e.nome)}</b><small>${esc(e.tipo)} · ${esc(e.estado)}</small></span><span class="num">${e.valor ? moneyC(e.valor) : '—'}</span></div>`;
    }).join('') || '<div class="empty">Nada previsto para os próximos 45 dias.</div>'}
  </section>`;
}

function openPayInvoice(cardId, fatura) {
  const c = cardOf(cardId);
  const b = bills().find(x => x.nome === c['Nome']);
  const totalF = DB.lancamentos.filter(t => t['Tipo'] === 'Saída' && t['Forma'] === 'Crédito' && cardOf(t['Cartão']) === c && t['Fatura'] === fatura).reduce((s, t) => s + cents(t['Valor']), 0);
  const pago = DB.lancamentos.filter(t => isCardPayment(t) && cardOf(t['Cartão']) === c && t['Fatura'] === fatura).reduce((s, t) => s + cents(t['Valor']), 0);
  const idc = idNovo();
  const el = sheet(`<h3>Pagar fatura ${esc(c['Nome'])}</h3>
    <p class="hint">${fmtFatura(fatura)} · total ${moneyC(totalF)} · já pago ${moneyC(pago)}. O pagamento sai da conta escolhida e abate a dívida do cartão; não conta como gasto.</p>
    <div class="row2"><label class="field"><span>Valor pago</span><input id="pvValor" type="number" step="0.01" min="0.01" inputmode="decimal" value="${(Math.max(0, totalF - pago) / 100).toFixed(2)}"></label>
      <label class="field"><span>Data</span><input id="pvData" type="date" value="${hojeISO()}"></label></div>
    <div class="row2"><label class="field"><span>Saiu da conta</span><select id="pvConta">${optList(DB.contas || [], c['Conta'])}</select></label>
      <label class="field"><span>Como</span><select id="pvForma">${optList(['Débito', 'Pix', 'Boleto', 'Transferência'], 'Débito')}</select></label></div>

function baixarCSV() {
  const [de, ate, rotulo] = periodoAtual();
  const lista = DB.lancamentos.filter(t => t._d >= de && t._d <= ate).sort((a, b) => a._d - b._d);
  const blob = new Blob([gerarCSV(lista)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'financas-' + String(rotulo).replace(/\s+/g, '-').toLowerCase() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('CSV gerado com ' + lista.length + ' lançamentos.');
}

function quick(id, kind, person) {
  const t = DB.lancamentos.find(x => x['ID'] === id);
  const base = { descricao: t['Descrição'] || '', categoria: t['Categoria'] || '' };
  const m = {
    meu: { ...base, pessoa: '', divisao: 'Meu', parte: 0 },
    dela: { ...base, pessoa: person, divisao: 'Dela', parte: t['Valor'] },
    div: { ...base, pessoa: person, divisao: 'Dividido', parte: Math.round(cents(t['Valor']) / 2) / 100 },
    transf: { tipo: 'Transferência', categoria: CAT_ENTRE_CONTAS, descricao: 'Transferência entre minhas contas', pessoa: '', parte: 0 },
    salario: { categoria: 'Salário', descricao: 'Salário', pessoa: '' },
  }[kind];
  if (kind === 'pessoa') {
    const p = DB.pessoas.find(x => x['Nome'] === person);
    const acerto = norm(p['Controla saldo']) === 'SIM';
    return save(call('api_atualizar', id, { pessoa: person, categoria: p['Categoria de entrada'] || 'Outras entradas',
      descricao: acerto ? `${person} me pagou` : `Pix de ${person}` }), acerto ? `Abatido do saldo de ${person}` : 'Entrada registrada');
  }
  save(call('api_atualizar', id, m), 'Salvo');
}

function save(promise, msg) {
  return promise.then(json => { load(json); closeSheet(); toast(msg); }).catch(err => toast('Não foi possível salvar: ' + (err.message || err)));
}

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function copySummary(name) {
  const { saldo, items } = balanceOf(name);
  const lines = items.slice().reverse().map(t => `${dShort(t._d)}  ${t['Descrição'] || t['Estabelecimento']}  ${t['Tipo'] === 'Entrada' ? '(pagou) −' : ''}${money(t['Tipo'] === 'Entrada' ? t['Valor'] : t['Parte terceiro'])}${t['Divisão'] === 'Dividido' ? ' (metade)' : ''}`);
  const text = `Resumo ${name}\n\n${lines.join('\n')}\n\nTotal em aberto: ${moneyC(saldo)}`;
  const done = () => toast('Resumo copiado. É só colar no WhatsApp.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Selecione e copie o texto manualmente.'); }
  ta.remove();
}

      <div class="chips" id="whoM">
        <button type="button" class="chip her ${mode === 'Dela' ? 'on' : ''}" data-m="Dela">Tudo</button>

}

/** Liga os botões do bloco "De quem" e devolve uma função que lê a escolha (null se faltar o nome). */
function bindWho(el, getValor, opts = {}) {
  const $ = s => el.querySelector(s);
  let p = ($('#whoP .chip.on') || {}).dataset?.p ?? '';
  let mode = ($('#whoM .chip.on') || { dataset: {} }).dataset.m || 'Dela';
  const sync = () => {
    $('#novaBox').hidden = p !== '__nova';
    if ($('#splitBox')) {
      $('#splitBox').hidden = !p;
      $('#parteBox').hidden = !p || mode !== 'Dividido';
      if (mode === 'Dividido' && !$('#fParte').value) $('#fParte').value = ((getValor() || 0) / 2).toFixed(2);
    }
  };
  const pick = b => {
    el.querySelectorAll('#whoP .chip').forEach(x => x.classList.remove('on')); b.classList.add('on');
    p = b.dataset.p; sync(); if (p === '__nova') $('#fNova').focus();
  };
  el.querySelectorAll('#whoP .chip').forEach(b => b.onclick = () => pick(b));
  el.querySelectorAll('#whoM .chip').forEach(b => b.onclick = () => {
    el.querySelectorAll('#whoM .chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); mode = b.dataset.m; sync();
  });
  if (opts.nova) pick($('#whoP [data-p="__nova"]'));
  return () => {
    if (!p) return { pessoa: '', divisao: 'Meu', parte: 0 };
    let nome = p, novaPessoa = null;
    if (p === '__nova') {
      nome = $('#fNova').value.trim();
      if (!nome) { $('#fNova').focus(); return null; }
      novaPessoa = { nome, controla: $('#fControla').checked };
    }
    const valor = getValor() || 0;
    const parte = !$('#splitBox') ? 0 : mode === 'Dela' ? valor : Number($('#fParte').value) || 0;
    return { pessoa: nome, divisao: $('#splitBox') ? mode : 'Meu', parte, novaPessoa };
  };
}

      </div>
      <label class="field" id="cardBox"><span>Cartão</span>${cardSelect('fCartao', t['Forma'] === 'Crédito' ? t['Cartão'] : '')}</label>
      <label class="field"><span>Estabelecimento (como veio do banco)</span><input id="fEstab" value="${esc(t['Estabelecimento'])}"></label>
    </div></details>
    <div class="foot">
      <button class="btn danger" id="del">Excluir</button>
      <div class="right"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Salvar</button></div>
    </div>
    <div id="confirmDel" class="confirm" hidden>
      <span>${t['Grupo'] ? 'Excluir só esta parcela ou todas?' : 'Excluir este lançamento de vez?'}</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="noDel">Manter</button><button class="btn" style="color:var(--out)" id="yesDel">${t['Grupo'] ? 'Só esta parcela' : 'Excluir'}</button>${t['Grupo'] ? '<button class="btn" style="color:var(--out)" id="yesDelAll">Todas as parcelas</button>' : ''}</span>
    </div>`);
  const $ = s => el.querySelector(s);
  const valorAtual = () => Number(($('#fValorPrev') || $('#fValor')).value) || t['Valor'];
  let readWho = null;

  function drawModo() {
    const area = $('#modoArea');
    const lembrar = t['Estabelecimento'] && t['Origem'] !== 'Manual' && t['Forma'] !== 'Pix'
      ? `<label class="check"><input type="checkbox" id="fLembrar"> Lembrar descrição e categoria para "${esc(t['Estabelecimento'])}"</label>` : '';
    readWho = null;
    if (previsto || modo === 'gasto' || modo === 'entrada') {
      const entrada = previsto || modo === 'entrada';
      area.innerHTML = (previsto ? '' : whoBlock(t, entrada)) + `
        <label class="field"><span>Categoria</span><select id="fCat"><option value="">—</option>${catOptions(entrada ? 'Entrada' : 'Saída', previsto ? 'Salário' : t['Categoria'])}</select></label>` + lembrar;
      if (!previsto) readWho = bindWho(area, valorAtual, opts);
    } else if (modo === 'transf') {
      area.innerHTML = `<p class="hint">Não conta como gasto nem como entrada. Se a outra ponta já estiver aqui (mesmo valor, outra conta, até 30 minutos de diferença), as duas ficam ligadas.</p>`;
    } else {
      const atual = cardOf(t['Cartão']) ? t['Cartão'] : '';
      area.innerHTML = `<div class="row2">
          <label class="field"><span>Qual cartão</span>${cardSelect('fFatCartao', atual)}</label>
          <label class="field"><span>Qual fatura</span><select id="fFatura"></select></label>
        </div>
        <p class="hint">Não conta como gasto: as compras desse cartão já foram contadas quando aconteceram.</p>`;
      const fillInvoices = () => {
        const opts2 = invoiceOptions($('#fFatCartao').value);
        $('#fFatura').innerHTML = opts2.length ? opts2.map(k => `<option value="${k}" ${k === t['Fatura'] ? 'selected' : ''}>${fmtFatura(k)}</option>`).join('') : '<option value="">Escolha o cartão primeiro</option>';
      };
      $('#fFatCartao').onchange = fillInvoices;
      fillInvoices();
    }
  }
  drawModo();
  el.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => {
    el.querySelectorAll('[data-modo]').forEach(x => x.classList.remove('on')); b.classList.add('on');
    modo = b.dataset.modo; opts = {}; drawModo();
  });
  const syncCard = () => { $('#cardBox').hidden = $('#fForma').value !== 'Crédito'; };
  $('#fForma').onchange = syncCard; syncCard();

  $('#cancel').onclick = closeSheet;
  $('#del').onclick = () => { $('#confirmDel').hidden = false; };
  $('#noDel').onclick = () => { $('#confirmDel').hidden = true; };
  $('#yesDel').onclick = () => save(call('api_excluir', id), 'Lançamento excluído');
  if ($('#yesDelAll')) $('#yesDelAll').onclick = () => save(call('api_excluir', id, { grupo: true }), 'Parcelas excluídas');
  $('#ok').onclick = () => {
    const m = { status: 'OK', descricao: $('#fDesc').value.trim() };
    if (previsto) {
      const v = Number($('#fValorPrev').value);
      if (!(v > 0)) return toast('Informe o valor que caiu.');
      Object.assign(m, { valor: v, categoria: $('#fCat').value || 'Salário', descricao: m.descricao || 'Salário' });
    } else {
      m.tipo = MODOS[modo].tipo;
      if (modo === 'gasto' || modo === 'entrada') {
        m.categoria = $('#fCat').value;
        const w = readWho(); if (!w) return toast('Escreva o nome da pessoa.');
        Object.assign(m, w);
        if (modo === 'entrada' && w.pessoa && !m.categoria) {
          const p = DB.pessoas.find(x => x['Nome'] === w.pessoa);
          m.categoria = p ? p['Categoria de entrada'] : (w.novaPessoa && w.novaPessoa.controla ? 'Acerto' : 'Outras entradas');
        }
      } else if (modo === 'transf') {
        Object.assign(m, { categoria: CAT_ENTRE_CONTAS, descricao: m.descricao || 'Transferência entre minhas contas' });
      } else {
        const cartao = $('#fFatCartao').value, fatura = $('#fFatura').value;
        if (!cartao || !fatura) return toast('Escolha o cartão e a fatura.');
        Object.assign(m, { categoria: CAT_FATURA, cartao, fatura, descricao: m.descricao || 'Fatura ' + cardLabel(cartao) });
      }
      const v = Number($('#fValor').value);
      if (cents(v) !== cents(t['Valor'])) { if (!(v > 0)) return toast('O valor precisa ser maior que zero.'); m.valor = v; }
    }
    const novaData = new Date($('#fData').value);
    if (!isNaN(novaData) && Math.abs(novaData - t._d) >= 6e4) m.data = novaData.toISOString();
    if ($('#fConta').value !== t['Conta']) m.conta = $('#fConta').value;
    if ($('#fForma').value !== t['Forma']) m.forma = $('#fForma').value;
    if ($('#fEstab').value.trim() !== String(t['Estabelecimento'])) m.estabelecimento = $('#fEstab').value.trim();
    if (modo === 'gasto' && (m.forma || t['Forma']) === 'Crédito') {
      const c = $('#fCartao').value;
      if (!c) return toast('Escolha o cartão da compra.');
      if (cardOf(c) !== cardOf(t['Cartão'])) m.cartao = c;
    }
    const fl = $('#fLembrar'); if (fl && fl.checked) m.lembrar = true;
    save(call('api_atualizar', id, m), 'Salvo');
  };
}

function openNew() {

  const el = sheet(`
    <h3>Novo lançamento</h3>
    <div class="chips" id="tipo"><button type="button" class="chip on" data-t="Saída">Gasto</button><button type="button" class="chip" data-t="Entrada">Entrada</button><button type="button" class="chip ghost" id="goTransfer">Entre minhas contas</button></div>

        <option value="Dinheiro|Dinheiro|">Dinheiro</option>
        ${(DB.contas || []).filter(c => c !== 'Dinheiro').map(c => `<option value="Pix|${esc(c)}|">Pix ${esc(c)}</option><option value="Débito|${esc(c)}|">Débito ${esc(c)}</option>`).join('')}
        ${DB.cartoes.map(c => `<option value="Crédito|${esc(c['Conta'])}|${esc(cardValue(c))}">Crédito ${esc(c['Nome'])}</option>`).join('')}
      </select></label>
    </div>
    <label class="field" id="parcBox" hidden><span>Parcelas</span><input id="nParc" type="number" min="1" max="48" value="1"></label>
    <p class="hint" id="parcHint" hidden></p>
    <div id="whoArea" style="display:grid;gap:14px"></div>
    <div class="foot"><span></span><div class="right"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="ok">Lançar</button></div></div>`);
  el.querySelector('#goTransfer').onclick = openTransfer;
  const syncParc = () => {
    const credito = el.querySelector('#nForma').value.indexOf('Crédito') === 0;
    el.querySelector('#parcBox').hidden = !credito;
    const n = Math.floor(Number(el.querySelector('#nParc').value) || 1), v = cents(el.querySelector('#nValor').value);
    el.querySelector('#parcHint').hidden = !credito || n < 2 || !v;
    el.querySelector('#parcHint').textContent = n > 1 && v ? n + 'x de ' + moneyC(Math.floor(v / n)) + ', uma em cada fatura. Só as parcelas contam como gasto, cada uma no seu mês.' : '';
  };
  ['#nForma', '#nParc', '#nValor'].forEach(q => { el.querySelector(q).oninput = syncParc; el.querySelector(q).onchange = syncParc; });
  syncParc();
  let tipo = 'Saída', readWho;
  const idCliente = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const getValor = () => Number(el.querySelector('#nValor').value) || 0;
  const drawWho = () => { el.querySelector('#whoArea').innerHTML = whoBlock({}, tipo === 'Entrada'); readWho = bindWho(el.querySelector('#whoArea'), getValor); };
  drawWho();
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    el.querySelectorAll('[data-t]').forEach(x => x.classList.remove('on')); b.classList.add('on'); tipo = b.dataset.t;
    el.querySelector('#nCat').innerHTML = '<option value="">—</option>' + catOptions(tipo, '');
    drawWho();
  });
  el.querySelector('#cancel').onclick = closeSheet;
  el.querySelector('#ok').onclick = () => {
    const valor = Number(el.querySelector('#nValor').value);
    if (!(valor > 0)) { el.querySelector('#nValor').focus(); return toast('Informe um valor maior que zero.'); }
    const [forma, conta, cartao] = el.querySelector('#nForma').value.split('|');
    const n = { tipo, valor, data: new Date(el.querySelector('#nData').value).toISOString(), descricao: el.querySelector('#nDesc').value.trim(),
      categoria: el.querySelector('#nCat').value, forma, conta, cartao, divisao: 'Meu', pessoa: '', parte: 0, idCliente,
      parcelas: forma === 'Crédito' ? Math.floor(Number(el.querySelector('#nParc').value) || 1) : 1 };
    const w = readWho(); if (!w) return toast('Escreva o nome da pessoa.');
    Object.assign(n, w);
    if (tipo === 'Entrada' && w.pessoa && !n.categoria) {
      const p = DB.pessoas.find(x => x['Nome'] === w.pessoa);
      n.categoria = p ? p['Categoria de entrada'] : (w.novaPessoa && w.novaPessoa.controla ? 'Acerto' : 'Outras entradas');
    }
    save(call('api_adicionar', n), 'Lançado');
  };
}

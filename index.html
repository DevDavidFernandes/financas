function showLock(temSenha) {
  document.getElementById('fab').hidden = true;
  document.getElementById('logout').hidden = true;
  document.querySelector('.month').hidden = true;
  const app = document.getElementById('app');
  app.innerHTML = temSenha ? `
    <form class="card lock" id="lockForm">
      <h2>Entrar</h2>
      <p class="lock-sub">Digite a senha do painel. Este aparelho fica conectado por 60 dias.</p>
      <label class="field"><span>Senha</span><input id="lkSenha" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p class="lock-err" id="lkErr" hidden></p>
    </form>` : `
    <form class="card lock" id="lockForm">
      <h2>Criar senha do painel</h2>
      <p class="lock-sub">Primeiro acesso. Para provar que é você, cole o <b>token</b> que está na aba <b>Config</b> da planilha.</p>
      <label class="field"><span>Token da aba Config</span><input id="lkToken" autocomplete="off" required></label>
      <label class="field"><span>Nova senha</span><input id="lkSenha" type="password" autocomplete="new-password" minlength="6" required></label>
      <label class="field"><span>Repita a senha</span><input id="lkSenha2" type="password" autocomplete="new-password" minlength="6" required></label>
      <button class="btn primary" type="submit">Criar e entrar</button>
      <p class="lock-err" id="lkErr" hidden></p>
    </form>`;
  const form = document.getElementById('lockForm');
  const err = document.getElementById('lkErr');
  form.querySelector('input').focus();
  form.onsubmit = e => {
    e.preventDefault();
    err.hidden = true;
    const senha = document.getElementById('lkSenha').value;
    if (!temSenha && senha !== document.getElementById('lkSenha2').value) { err.textContent = 'As senhas não são iguais.'; err.hidden = false; return; }
    const btn = form.querySelector('button'); btn.disabled = true;
    const p = temSenha ? call('api_entrar', senha) : call('api_criarSenha', document.getElementById('lkToken').value, senha);
    p.then(s => { saveSession(s); loadAll(); })
     .catch(x => { err.textContent = String((x && x.message) || x).replace(/^Error:\s*/, ''); err.hidden = false; btn.disabled = false; });
  };
}

function loadAll() {
  document.getElementById('fab').hidden = false;
  document.getElementById('logout').hidden = NO_GOOGLE;
  document.querySelector('.month').hidden = false;
  document.getElementById('app').innerHTML = '<div class="loading">Carregando seus lançamentos…</div>';

    load(json);
    const go = v => {
      if (v !== 'revisar') return;
      const first = DB.lancamentos.find(isPending);
      const sec = document.getElementById('revisar');
      if (sec) sec.scrollIntoView({ behavior: 'smooth' });
      if (first) openEdit(first['ID']);

    if (IN_GAS && google.script.url) google.script.url.getLocation(loc => go(loc.parameter.v));

    document.getElementById('app').innerHTML = `<div class="empty">Não consegui carregar a planilha: ${esc(err.message || err)}. Confira se rodou "configurar" no editor do script.</div>`;
  });
}

  add({ 'Data': at(0, 28, 8), 'Tipo': 'Entrada', 'Valor': 1500, 'Descrição': 'Salário', 'Categoria': 'Salário', 'Conta': 'Bradesco', 'Forma': 'Depósito', 'Cartão': '', 'Status': 'Previsto' });

  const base = {
    cartoes: [{ 'Nome': 'Santander', 'Final': '6051', 'Conta': 'Santander', 'Fechamento': 2, 'Vencimento': 8, 'Limite': 6000 },
              { 'Nome': 'Mercado Pago', 'Final': 'MP', 'Conta': 'Mercado Pago', 'Fechamento': 2, 'Vencimento': 9, 'Limite': 1800 }],
    pessoas: [{ 'Nome': 'Luiza', 'Controla saldo': 'Sim', 'Categoria de entrada': 'Acerto', 'Conta como renda': 'Não' },
              { 'Nome': 'Mãe', 'Controla saldo': 'Não', 'Categoria de entrada': 'Família', 'Conta como renda': 'Sim' }],
    fixos: [{ 'Nome': 'Claude AI', 'Valor': 113.85, 'Dia': 1, 'Forma': 'Crédito Mercado Pago', 'Palavra-chave': 'CLAUDE' },
            { 'Nome': 'Internet', 'Valor': 99.9, 'Dia': 10, 'Forma': 'Boleto', 'Palavra-chave': 'INTERNET|VIVO' },
            { 'Nome': 'Academia', 'Valor': 89.9, 'Dia': 5, 'Forma': 'Pix', 'Palavra-chave': 'ACADEMIA|SMART FIT' }],
    categorias: ['Alimentação', 'Mercado', 'Transporte', 'Moradia', 'Contas', 'Assinaturas', 'Saúde', 'Lazer', 'Compras', 'Educação', 'Presentes', 'Outros']
      .map(c => ({ 'Categoria': c, 'Tipo': 'Saída', 'Limite mensal': c === 'Alimentação' ? 500 : '' }))
      .concat(['Salário', 'Família', 'Acerto', 'Outras entradas'].map(c => ({ 'Categoria': c, 'Tipo': 'Entrada', 'Limite mensal': '' })))
      .concat(['Entre contas', 'Pagamento de fatura'].map(c => ({ 'Categoria': c, 'Tipo': 'Transferência', 'Limite mensal': '' }))),
  };
  const ini = new Date(Y, M, 1, 8).toISOString();
  base.contasDetalhe = [
    { 'Nome': 'Santander', 'Instituição': 'Santander', 'Tipo': 'Conta corrente', 'Saldo inicial': 1200, 'Data do saldo': ini, 'Ativa': 'Sim' },
    { 'Nome': 'Bradesco', 'Instituição': 'Bradesco', 'Tipo': 'Conta corrente', 'Saldo inicial': 300, 'Data do saldo': ini, 'Ativa': 'Sim' },
    { 'Nome': 'Mercado Pago', 'Instituição': 'Mercado Pago', 'Tipo': 'Carteira digital', 'Saldo inicial': '', 'Data do saldo': '', 'Ativa': 'Sim' },
    { 'Nome': '99Pay', 'Instituição': '99', 'Tipo': 'Carteira digital', 'Saldo inicial': 50, 'Data do saldo': ini, 'Ativa': 'Sim' },
    { 'Nome': 'Dinheiro', 'Instituição': '', 'Tipo': 'Dinheiro', 'Saldo inicial': 40, 'Data do saldo': ini, 'Ativa': 'Sim' },
  ];
  base.metas = [{ 'Nome': 'Reserva de emergência', 'Valor alvo': 3000, 'Valor atual': 450, 'Data alvo': new Date(Y + 1, 5, 30).toISOString(), 'Aporte mensal': 200, 'Conta': '', 'Ativa': 'Sim' }];
  base.fixos.forEach(f => Object.assign(f, { 'Frequência': 'Mensal', 'Tipo': 'Saída', 'Ativo': 'Sim', 'Categoria': f['Categoria'] || 'Contas' }));
  base.config = { 'Limite mensal geral': 1500, 'Alerta de orçamento (%)': 80, 'Alerta de limite do cartão (%)': 80 };
  const dump = () => JSON.stringify(Object.assign({ lancamentos: L, salario: [], recorrencias: base.fixos, contas: ['Santander', 'Bradesco', 'Mercado Pago', '99Pay', 'PicPay', 'Dinheiro'],
    formas: ['Crédito', 'Débito', 'Pix', 'Dinheiro', 'Transferência', 'Boleto', 'Depósito'] }, base));
  const find = i => L.find(t => t['ID'] === i);
  const novaPessoa = p => { if (p && p.nome && !base.pessoas.some(x => x['Nome'] === p.nome)) base.pessoas.push({ 'Nome': p.nome, 'Controla saldo': p.controla ? 'Sim' : 'Não', 'Categoria de entrada': p.controla ? 'Acerto' : 'Outras entradas', 'Conta como renda': p.controla ? 'Não' : 'Sim' }); };
  return {
    api_dados: dump,
    api_atualizar(i, m) {
      const t = find(i); const map = { descricao: 'Descrição', categoria: 'Categoria', tipo: 'Tipo', valor: 'Valor', pessoa: 'Pessoa', divisao: 'Divisão', parte: 'Parte terceiro',
        estabelecimento: 'Estabelecimento', conta: 'Conta', forma: 'Forma', cartao: 'Cartão', fatura: 'Fatura', data: 'Data' };
      if (m.divisao === 'Meu') { m.pessoa = ''; m.parte = 0; } if (m.divisao === 'Dela') m.parte = m.valor || t['Valor'];
      Object.keys(map).forEach(k => { if (k in m) t[map[k]] = m[k]; }); t['Status'] = m.status || 'OK'; novaPessoa(m.novaPessoa); return dump();
    },
    api_marcarTodosMeus() { L.filter(t => t['Status'] === 'Novo' && t['Tipo'] === 'Saída').forEach(t => t['Status'] = 'OK'); return dump(); },
    api_adicionar(n) {
      novaPessoa(n.novaPessoa);
      add({ 'Data': n.data, 'Tipo': n.tipo, 'Valor': n.valor, 'Descrição': n.descricao, 'Categoria': n.categoria, 'Conta': n.conta, 'Forma': n.forma,
            'Cartão': n.cartao, 'Fatura': n.forma === 'Crédito' ? fat(n.data) : '', 'Pessoa': n.pessoa, 'Divisão': n.divisao, 'Parte terceiro': n.parte });
      return dump();
    },
    api_sair() { return true; },
    api_pagarFatura(p) {
      add({ 'Data': p.data, 'Tipo': 'Transferência', 'Valor': p.valor, 'Descrição': 'Fatura ' + p.cartao, 'Estabelecimento': 'Pagamento de fatura',
        'Categoria': 'Pagamento de fatura', 'Conta': p.conta, 'Forma': p.forma, 'Cartão': p.cartao, 'Fatura': p.fatura, 'Sentido': 'Saída' });
      return dump();
    },
    api_transferir(t) {
      ['Saída', 'Entrada'].forEach((sen, i) => add({ 'Data': t.data, 'Tipo': 'Transferência', 'Valor': t.valor, 'Descrição': 'Transferência ' + t.de + ' → ' + t.para,
        'Estabelecimento': i ? 'Transferência recebida' : 'Transferência enviada', 'Categoria': 'Entre contas', 'Conta': i ? t.para : t.de, 'Forma': 'Transferência', 'Cartão': '', 'Sentido': sen }));
      return dump();
    },
    api_salvarConta(c) {
      const o = base.contasDetalhe.find(x => x['Nome'] === (c.nomeOriginal || c.nome)) || (base.contasDetalhe.push({}), base.contasDetalhe[base.contasDetalhe.length - 1]);
      Object.assign(o, { 'Nome': c.nome, 'Instituição': c.instituicao, 'Tipo': c.tipo, 'Saldo inicial': c.saldoInicial, 'Data do saldo': c.dataSaldo, 'Ativa': c.ativa ? 'Sim' : 'Não' });
      return dump();
    },
    api_salvarMeta(m) {
      const o = base.metas.find(x => x['Nome'] === (m.nomeOriginal || m.nome)) || (base.metas.push({}), base.metas[base.metas.length - 1]);
      Object.assign(o, { 'Nome': m.nome, 'Valor alvo': Number(m.alvo), 'Valor atual': Number(m.atual) || 0, 'Data alvo': m.dataAlvo, 'Aporte mensal': m.aporte, 'Conta': m.conta, 'Ativa': 'Sim' });
      return dump();
    },
    api_excluirMeta(nome) { base.metas = base.metas.filter(x => x['Nome'] !== nome); return dump(); },
    api_salvarFixo(f) {
      const o = base.fixos.find(x => x['Nome'] === (f.nomeOriginal || f.nome)) || (base.fixos.push({}), base.fixos[base.fixos.length - 1]);
      Object.assign(o, { 'Nome': f.nome, 'Valor': Number(f.valor), 'Dia': Number(f.dia), 'Categoria': f.categoria, 'Forma': f.forma, 'Palavra-chave': f.palavra,
        'Ativo': f.ativo, 'Frequência': f.frequencia, 'Tipo': f.tipo, 'Início': f.inicio, 'Fim': f.fim, 'Intervalo (dias)': f.intervalo });
      return dump();
    },
    api_salvarOrcamento(o) {
      if (o.categoria) base.categorias.find(c => c['Categoria'] === o.categoria)['Limite mensal'] = o.limite;
      if ('geral' in o) base.config['Limite mensal geral'] = o.geral;
      if ('alerta' in o) base.config['Alerta de orçamento (%)'] = Number(o.alerta);
      if ('alertaCartao' in o) base.config['Alerta de limite do cartão (%)'] = Number(o.alertaCartao);
      return dump();
    },
    api_excluir(i) { L.splice(L.indexOf(find(i)), 1); return dump(); },
    api_pagarFixo(nome, v) { const f0 = base.fixos.find(x => x['Nome'] === nome); if (v) f0['Valor'] = v; return this.__pagar(nome); },
    __pagar(nome) { const f = base.fixos.find(x => x['Nome'] === nome); add({ 'Data': new Date().toISOString(), 'Valor': f['Valor'], 'Descrição': nome, 'Estabelecimento': nome, 'Categoria': 'Contas', 'Forma': 'Pix', 'Cartão': '' }); return dump(); },
  };
})();

start();
</script>

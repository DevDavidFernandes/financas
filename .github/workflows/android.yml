# Gera o APK do app Finanças. Roda sozinho quando index.html ou app/ mudam,
# ou à mão em Actions → "App Android" → Run workflow. O APK fica em Artifacts.
name: App Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependências
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Painel (mesmo index.html do site)
        run: mkdir -p app/www && cp index.html app/www/index.html

      - name: Projeto Android
        working-directory: app
        run: |
          npx cap add android
          node scripts/preparar-android.js
          npx cap sync android

      # Chave fixa (opcional): com o segredo ANDROID_DEBUG_KEYSTORE (base64), as versões novas
      # instalam por cima da antiga sem precisar desinstalar.
      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore; echo "usando chave fixa"; else echo "sem chave fixa"; fi

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: financas-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
